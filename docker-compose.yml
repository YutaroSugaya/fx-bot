services:
  postgres:
    image: postgres:16-alpine
    container_name: fxbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fxbot
      POSTGRES_PASSWORD: fxbot
      POSTGRES_DB: fxbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxbot -d fxbot"]
      interval: 5s
      timeout: 5s
      retries: 5
