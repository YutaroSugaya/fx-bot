# llm-v7 (GBP_JPY) — LLM 判断ループ用の strategy config
# ------------------------------------------------------------------
# 中身は trend-v4-gbpjpy と同一の trend_follow ブロック。差分は 2 点:
#   1. max_loss_in_this_window_jpy = 0(window kill-switch 無効)。
#      このカウンタは valid_from 起点でリセットされない累積値なので、有効にすると一定額の負けで
#      その config が恒久的に新規を止める(ログ上は無言の凍結になる)。
#      守りは 日次損失cap / per-trade cap / スプレッド / emergency_stop / broker OCO / ナンピン禁止 が担う。
#   2. entry.max_spread_pips = 3.0(コード側のスプレッドガード 3.0 と揃える。config 側が狭いと
#      LLM が 3.0 以内で通した判断を admission 層が黙って弾く)。
# エントリーは LLM ループ(playbook)が担い、この config は FK アンカー +
# admission の risk/entry ゲート値として機能する(engine tick エントリーは LLM 所有で無効)。
# 有効化 = DB strategy_configs(status='active')に seed する:
#   bash scripts/seed_active_config.sh [--apply] [--mode paper_config|live_config] configs/llm_v7_GBP_JPY.yaml
config_id: "llm-v7-gbpjpy"
generated_at: "2026-07-06T17:30:00+09:00"
valid_from: "2026-07-06T00:00:00Z"
valid_until: "2030-12-31T23:59:59Z"

symbol: GBP_JPY
enabled: true

market_regime:
  type: "unclear"
  confidence: 0.70
  reason: "v7 re-seed; エントリー判断は LLM ループ(playbook)が担当。engine 側 trend_follow は entries disabled"

strategy:
  name: "trend_follow"

entry:
  # スプレッド床はコード側のガードと同じ 3.0(早朝でも spread<3.0 なら試す)。
  max_spread_pips: 3.0
  require_breakout: false
  direction: "both"

exit:
  # 出口は trend_follow.go が ATR から定数算出(SL=2×ATR / ratchet arm3×&give1.5×ATR / TP off / MaxHold 30日)。
  # 下の値は validator placeholder で runtime には使われない(Signal が上書き)。
  exit_policy: strategy_computed
  take_profit_pips: 100.0
  stop_loss_pips: 30.0
  max_hold_minutes: 43200
  extension_max_minutes: 0
  extension_unrealized_pips_threshold: 0.0
  early_exit_window_minutes: 0
  early_exit_target_pips: 0.0
  ratchet_arm_pips: 0.0
  ratchet_giveback_pips: 0.0

risk:
  quantity: 1000
  max_open_positions: 1
  max_trades_in_this_window: 0
  # window kill-switch 無効(0 = ゲート無効)。
  max_loss_in_this_window_jpy: 0

no_trade:
  enabled: false
  reason: ""
