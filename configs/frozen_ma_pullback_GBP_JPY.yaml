# frozen-mapb (GBP_JPY) — 200MA pullback デイトレ runner 固定 active config(凍結実験)
# ------------------------------------------------------------------
# ma_pullback の出口を「デイトレ runner」(trailing ratchet で勝ちを伸ばす) にした config。
# 公開手法の調査からの逆算。
#
# 入口 = MTF。トレンド方向は 1H 200SMA の傾き (大局は上位足)、執行 (押し目/節目/反発) は
#        5m。価格が 5m 200MA ゾーンに戻り (k×ATR 内)、直近スイング S/R・当日高安と重なり (厳選)、
#        最後の 5m 足が順方向に確定 (反発確認) した所で順張り。
# 出口 = デイトレ runner (戦略 ma_pullback.go が定数で算出 → 既存 Signal 経路、出口エンジン無改造):
#        主出口 = trailing ratchet (arm16/give8: 含み益 +16 で武装→ピークから 8 戻しで決済=勝ちを伸ばす)。
#        TP = 次の高安の密集地帯 far edge (構造的 backstop 30-80, ratchet arm より上で先取りしない)。
#        SL = 守る 5m MA のブレイク基準 (構造的 8-20)。時間stop = 480 分 (塩漬け回収)。
#        ↑ 薄利で切る出口 (TP 上限 20 / ratchet 無 / 時間stop 無) にしないのは意図的 (勝ちを伸ばす)。
#
# 5m 200MA は起動時の 24h 復元 (288 本) で、1h 200SMA の傾き (220 本) は 1h の 14 日復元で満たす
# (DB に 1h 足が溜まっていない初回は本数が足りず、溜まるまで見送ることがある)。
# 有効化 = DB strategy_configs(status='active')に seed する:
#   bash scripts/seed_active_config.sh [--apply] [--mode paper_config|live_config] configs/frozen_ma_pullback_GBP_JPY.yaml
config_id: "frozen-mapb-gbpjpy-v3-1"
generated_at: "2026-06-10T12:00:00+09:00"
valid_from: "2026-06-08T00:00:00Z"
# 遠未来 = TTL 失効しない (engine/gate の expired 判定を恒久パス)。
valid_until: "2030-12-31T23:59:59Z"

symbol: GBP_JPY
enabled: true

market_regime:
  # direction=both なので regime は方向を縛らない (実行時の 1h 200SMA の傾きが side を決める)。
  type: "unclear"
  confidence: 0.70
  reason: "frozen manual config (ma_pullback, ratchet で伸ばす出口); side は 1h 200SMA の傾きで決定"

strategy:
  name: "ma_pullback"

entry:
  # spread > 1.0pip は no_trade (東京早朝の ~10pip 拡大はここで自動回避)。
  max_spread_pips: 1.0
  # ma_pullback は「MA ゾーンへの戻り＋反発」で入る反発型。config の require_breakout
  # (breakout_follow 用) とは無関係なので必ず false。
  require_breakout: false
  direction: "both"

exit:
  # デイトレ runner: runtime 出口は戦略 (ma_pullback.go) が定数で算出する:
  #   主出口 = trailing ratchet (arm16/give8) / TP = 構造的 backstop 30-80 / SL = 構造的 8-20 /
  #   時間stop = 480 分。ratchet と max_hold は下で戦略定数と一致させ、live 監査行を正直に。
  #   take_profit_pips / stop_loss_pips は validator + dead-market guard 用の代表 placeholder で
  #   runtime には使われない (Signal で上書き; TP は RR-floor locked=arm-give=8 ≥ TP×0.5 を通す 14)。
  exit_policy: strategy_computed
  take_profit_pips: 14.0
  stop_loss_pips: 10.0
  max_hold_minutes: 480
  extension_max_minutes: 0
  extension_unrealized_pips_threshold: 0.0
  early_exit_window_minutes: 0
  early_exit_target_pips: 0.0
  # trailing ratchet = runner の主出口 (戦略定数 arm16/give8 と一致)。
  ratchet_arm_pips: 16.0
  ratchet_giveback_pips: 8.0

risk:
  quantity: 1000
  max_open_positions: 1
  # 0 = 無制限窓 (固定 config は窓が永続)。ブレーキは日次 loss cap。
  max_trades_in_this_window: 0
  max_loss_in_this_window_jpy: 0

no_trade:
  enabled: false
  reason: ""
